name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm

      - name: Detect missing native tools
        id: native-packages
        shell: bash
        run: |
          packages=()
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            packages+=(ffmpeg)
          fi
          if ! command -v glslangValidator >/dev/null; then
            packages+=(glslang-tools)
          fi
          printf 'packages=%s\n' "${packages[*]}" >> "$GITHUB_OUTPUT"
          printf 'image=%s\n' "${ImageVersion:-ubuntu-24.04}" >> "$GITHUB_OUTPUT"

      - name: Restore native tool downloads
        id: native-apt-cache
        if: steps.native-packages.outputs.packages != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gunsmith-native-apt/*.deb
          key: native-apt-v1-${{ runner.arch }}-${{ steps.native-packages.outputs.image }}-${{ steps.native-packages.outputs.packages }}

      - name: Install native audio and shader tools
        timeout-minutes: 10
        shell: bash
        env:
          APT_ARCHIVES: ${{ runner.temp }}/gunsmith-native-apt
          NATIVE_PACKAGES: ${{ steps.native-packages.outputs.packages }}
        run: |
          if [[ -n "$NATIVE_PACKAGES" ]]; then
            read -r -a packages <<< "$NATIVE_PACKAGES"
            mkdir -p "$APT_ARCHIVES"
            options=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
            sudo apt-get "${options[@]}" -o APT::Update::Error-Mode=any update
            sudo apt-get "${options[@]}" -o Dir::Cache::archives="$APT_ARCHIVES" \
              -o APT::Keep-Downloaded-Packages=true install -y --no-install-recommends "${packages[@]}"
          fi
          command -v ffmpeg
          command -v ffprobe
          command -v glslangValidator

      - name: Save native tool downloads
        if: github.ref == 'refs/heads/main' && steps.native-packages.outputs.packages != '' && steps.native-apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gunsmith-native-apt/*.deb
          key: ${{ steps.native-apt-cache.outputs.cache-primary-key }}

      - run: pnpm install --frozen-lockfile

      - run: pnpm checks

      - name: Build release assets
        run: pnpm --filter @gunsmith/webapp compile

      - name: Require noindex in the release assets
        shell: bash
        run: |
          diff -u <(printf '/*\n  X-Robots-Tag: noindex\n') webapp/build/_headers

      - name: Record the built commit
        run: printf '{"commit":"%s"}\n' "$GITHUB_SHA" > webapp/build/release.json

      - name: Check the API Worker bundle
        run: pnpm --filter @gunsmith/api exec wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-webapp
          path: webapp/build/
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  acceptance-tests:
    name: Acceptance tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium and system dependencies
        timeout-minutes: 5
        run: pnpm --filter @gunsmith/acceptance-tests exec playwright install --with-deps chromium

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-webapp
          path: webapp/build/

      - name: Run acceptance shard
        # One worker leaves CPU for Chromium rendering and the local Worker. Playwright's
        # deadline leaves time to write and upload its blob before the job deadline.
        run: pnpm acceptance-tests --shard=${{ matrix.shard }}/${{ strategy.job-total }} --workers=1 --retries=1 --global-timeout=1200000 --reporter=github,line,blob
        env:
          PREVIEW_ACCEPTANCE: "1"
          PREVIEW_API_MODE: local
          PLAYWRIGHT_BLOB_OUTPUT_NAME: shard-${{ matrix.shard }}.zip

      # Blobs include retry traces, screenshots and videos; preserve failures too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: acceptance-tests/blob-report/
          overwrite: true
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare
    needs: acceptance-tests
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.GUNSMITH_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      current: ${{ steps.tip.outputs.current }}
      url: ${{ steps.tip.outputs.url }}
      api_url: ${{ steps.tip.outputs.api_url }}
    env:
      SITE_ORIGIN: https://gunsmith.neilarmstrong.dev
      API_ORIGIN: https://gunsmith-api.neilarmstrong.dev
    steps:
      - name: Check the current main commit
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ "$tip" != "$GITHUB_SHA" ]]; then
            echo 'This run was superseded by a newer main commit.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'current=true' >> "$GITHUB_OUTPUT"
          echo "url=$SITE_ORIGIN" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_ORIGIN" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tip.outputs.current == 'true'
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.tip.outputs.current == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.tip.outputs.current == 'true'
        with:
          node-version: 26.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.tip.outputs.current == 'true'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.tip.outputs.current == 'true'
        with:
          name: release-webapp
          path: webapp/build/

      - name: Deploy the API Worker and the tested webapp build
        if: steps.tip.outputs.current == 'true'
        run: pnpm --filter @gunsmith/infra provision
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
          ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          ALERT_TO_ADDRESS: ${{ secrets.ALERT_TO_ADDRESS }}
          ACCOUNT_DIGEST_KEY: ${{ secrets.ACCOUNT_DIGEST_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Verify the deployed commit, noindex and D1
        if: steps.tip.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl --fail --silent --max-time 5 "$SITE_ORIGIN/release.json?commit=$GITHUB_SHA" |
                jq -e --arg commit "$GITHUB_SHA" '.commit == $commit' > /dev/null; then
              if ! curl --fail --silent --show-error --max-time 10 --dump-header - --output /dev/null "$SITE_ORIGIN/" |
                  tr -d '\r' | grep -iEx 'X-Robots-Tag:[[:blank:]]*noindex[[:blank:]]*' > /dev/null; then
                echo 'The deployed homepage must return X-Robots-Tag: noindex.' >&2
                exit 1
              fi
              headers="$(mktemp)"
              curl --fail --silent --show-error --max-time 10 --dump-header "$headers" \
                --header "Origin: $SITE_ORIGIN" --cookie 'session=release-check' "$API_ORIGIN/api/me" |
                jq -e '.signedIn == false' > /dev/null
              tr -d '\r' < "$headers" | grep -iFx "Access-Control-Allow-Origin: $SITE_ORIGIN" > /dev/null
              tr -d '\r' < "$headers" | grep -iFx 'Access-Control-Allow-Credentials: true' > /dev/null
              printf 'Deployed `%s` to %s.\n' "$GITHUB_SHA" "$SITE_ORIGIN" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 4
          done
          echo 'The deployed asset marker did not match this commit.' >&2
          exit 1

  live-acceptance:
    name: Acceptance tests against deployment (${{ matrix.shard }}/4)
    needs: deploy
    if: needs.deploy.outputs.current == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @gunsmith/acceptance-tests exec playwright install --with-deps chromium

      - name: Verify the deployed commit
        env:
          WEBAPP_URL: ${{ needs.deploy.outputs.url }}
        shell: bash
        run: |
          curl --fail --silent --show-error --max-time 10 "$WEBAPP_URL/release.json?commit=$GITHUB_SHA" |
            jq -e --arg commit "$GITHUB_SHA" '.commit == $commit'

      - name: Run acceptance shard
        run: pnpm acceptance-tests --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=github,blob
        env:
          WEBAPP_URL: ${{ needs.deploy.outputs.url }}
          RELEASE_API_URL: ${{ needs.deploy.outputs.api_url }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: shard-${{ matrix.shard }}.zip

      # Blobs include retry traces, screenshots and videos; preserve failures too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-live-blob-${{ matrix.shard }}
          path: acceptance-tests/blob-report/
          overwrite: true
          retention-days: 7
          if-no-files-found: error
