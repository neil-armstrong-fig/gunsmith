name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg glslang-tools
      - run: pnpm install --frozen-lockfile
      - run: pnpm checks

  acceptance-tests:
    name: Acceptance tests (production preview)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gunsmith/acceptance-tests exec playwright install --with-deps chromium
      - run: pnpm acceptance-tests:preview
      # Upload on success too: a passing retry still deserves visible evidence.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-preview
          path: |
            acceptance-tests/playwright-report/
            acceptance-tests/test-results/
          retention-days: 7
          if-no-files-found: warn
