<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sources and credits for the design of Gunsmith." />
    <title>References &amp; credits · Gunsmith</title>
    <style>
      :root {
        color-scheme: dark;
        background: #10151b;
        color: #e5eaf0;
        font:
          1rem/1.6 system-ui,
          sans-serif;
      }

      body {
        margin: 0;
      }

      main {
        max-width: 44rem;
        margin-inline: auto;
        padding: clamp(1.25rem, 6vw, 4rem);
      }

      h1 {
        margin: 1rem 0 2rem;
        font-size: clamp(2rem, 5vw, 3.25rem);
        line-height: 1.12;
      }

      h2 {
        margin: 0 0 1rem;
        font-size: 1.25rem;
      }

      h3,
      p {
        margin: 0;
      }

      section {
        border-top: 1px solid #465a6b;
        padding-top: 1.5rem;
      }

      a {
        color: #8dc8ff;
        text-underline-offset: 0.2em;
      }

      a:focus-visible {
        outline: 2px solid #8dc8ff;
        outline-offset: 4px;
      }

      article {
        border-radius: 0.5rem;
        background: #19222d;
        padding: 1.25rem;
      }

      .byline {
        margin: 0.15rem 0 0.65rem;
        color: #a7b3c2;
        font-size: 0.875rem;
      }
    </style>
  </head>

  <body>
    <main>
      <header>
        <a href="/">Gunsmith</a>
        <h1>References &amp; credits</h1>
      </header>

      <section aria-labelledby="audio-design">
        <h2 id="audio-design">Audio design</h2>

        <article>
          <h3>
            <a href="https://www.gameaudiolearning.com/knowledgebase/how-to-record-foley-for-games"
              >How To Create Foley For Games</a
            >
          </h3>
          <p class="byline">Greg Lester · Game Audio Learning</p>
          <p>
            Lester’s guide to layering contact, movement and material sounds informed Gunsmith’s footfalls, reload and
            hit confirmation.
          </p>
        </article>
      </section>
    </main>
  </body>
</html>
